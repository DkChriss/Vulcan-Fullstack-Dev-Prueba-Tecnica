services:
  api:
    container_name: api
    image: api
    build:
      context: ./api/dev-test/
      dockerfile: .dockerfile
    restart: on-failure
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_NAME=${APP_NAME}
      - APP_PORT=${APP_PORT}
    networks:
      - dev-net

  web:
    restart: unless-stopped
    build:
      context: ./web/
      dockerfile: .dockerfile
    ports:
      - 4200:80
    networks:
      - dev-net

  postgres:
    image: postgres:14-alpine
    container_name: pg_sql
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgresqldata:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - dev-net
    restart: unless-stopped

networks:
  dev-net:
    driver: bridge

volumes:
  postgresqldata:
