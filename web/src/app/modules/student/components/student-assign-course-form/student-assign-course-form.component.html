<form class="bg-card" [formGroup]="form.formGroup" (ngSubmit)="formSubmit()" novalidate>
    <h2 mat-dialog-title>Asignar Cursos</h2>
    <mat-dialog-content class="mat-typography">
        <div class="gt-xs:flex-row flex flex-col">
            <mat-form-field>
                <mat-label>Cursos:</mat-label>
                <mat-select formControlName="courses" multiple>
                    @for (course of courses; track course) {
                    <mat-option [value]="course.id">{{course.name}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cerrar</button>
        <button mat-button type="submit" cdkFocusInitial>Guardar</button>
    </mat-dialog-actions>
</form>
