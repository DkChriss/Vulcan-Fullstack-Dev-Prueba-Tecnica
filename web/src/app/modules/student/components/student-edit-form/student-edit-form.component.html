<form class="bg-card" [formGroup]="form.formGroup" (ngSubmit)="formSubmit()" novalidate>
    <h2 mat-dialog-title>Editar alumno</h2>
    <mat-dialog-content class="mat-typography">
        <div class="gt-xs:flex-row flex flex-col">
            <mat-form-field class="gt-xs:pr-3 flex-auto">
                <mat-label>Nombre</mat-label>
                <input matInput formControlName="firstName" />
                <mat-icon class="icon-size-5" matSuffix [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
            </mat-form-field>
            <mat-form-field class="gt-xs:pl-3 flex-auto">
                <mat-label>Apellido</mat-label>
                <input matInput formControlName="lastName" />
                <mat-icon class="icon-size-5" matSuffix [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
            </mat-form-field>
            <mat-form-field class="gt-xs:pl-3 flex-auto">
                <mat-label>Genero</mat-label>
                <select matNativeControl required formControlName="gender">
                    <option value="">Seleccione el genero</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                </select>
            </mat-form-field>
            <mat-form-field class="gt-xs:pl-3 flex-auto">
                <mat-label>Edad</mat-label>
                <input matInput formControlName="age" />
                <mat-icon class="icon-size-5" matSuffix [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
            </mat-form-field>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cerrar</button>
        <button mat-button cdkFocusInitial type="submit">Guardar</button>
    </mat-dialog-actions>
</form>
